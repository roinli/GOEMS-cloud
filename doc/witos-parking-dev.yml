# spring配置
spring:
  redis:
    host: 127.0.0.1
    port: 6379
    password: aq114477
    timeout: 1000
    jedis:
      pool:
        max-active: 10
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: admin
        loginPassword: 123456
    dynamic:
      druid:
        initial-size: 5
        min-idle: 50
        maxActive: 100
        maxWait: 60000
        timeBetweenEvictionRunsMillis: 300000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1 FROM DUAL
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 50
        filters: stat,slf4j
        connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://127.0.0.1:3306/witos_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: root
          password: aq114477

seata:
  enabled: false
  application-id: ${spring.application.name}
  tx-service-group: ${spring.application.name}-group
  enable-auto-data-source-proxy: false
  service:
    vgroup-mapping:
      witos-parking-group: default
  config:
    type: nacos
    nacos:
      serverAddr: witos-nacos:8848
      group: SEATA_GROUP
      namespace:
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: witos-nacos:8848
      namespace:

swagger:
  title: 停车场模块接口文档
  license: Powered By witos
  licenseUrl: https://witos.vip

parking:
  tencent-map:
    key: E3VBZ-FSRL4-DENUC-KCIS7-N6B5H-UGBY6
  h5:
    pay-url: http://localhost:81

feign:
  sentinel:
    enabled: true
  okhttp:
    enabled: true
  httpclient:
    enabled: false
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 10000
        loggerLevel: full
        requestInterceptors: com.witos.common.security.feign.FeignRequestInterceptor

